<style>
/* Layout: one readable column, red enamel sign header like the game, kraft-paper page. */
:root{
  --chili:#d63f2a; --chili-deep:#a92c1c; --on-chili:#ffffff;
  --kraft:#f4ead8; --card:#fffcf6; --line:#e2d3b8;
  --ink:#2b1e18; --ink-soft:#6f5b4e; --herb:#2f8a4a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --kraft:#1f1915; --card:#2a221d; --line:#43372e; --ink:#f3e9dc; --ink-soft:#bfae9c; --herb:#6cc488; color-scheme: dark; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--kraft);color:var(--ink);font:16px/1.6 "Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
header{background:var(--chili);color:var(--on-chili);box-shadow:inset 0 -5px 0 var(--chili-deep)}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:18px 22px}
header img{width:56px;height:56px;border-radius:14px;flex:none;box-shadow:0 2px 0 var(--chili-deep)}
header b{display:block;font:800 22px/1.1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase}
header span{display:block;opacity:.9;font-size:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;padding-block:16px 0}
nav button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13px system-ui,sans-serif;cursor:pointer}
nav button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--card)}
nav button:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
main{padding-block:8px 40px}
h1{font-size:26px;line-height:1.2;margin:18px 0 4px;text-wrap:balance}
.date{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.summary{background:var(--card);border:2px solid var(--herb);border-radius:14px;padding:14px 16px;margin:0 0 22px}
.summary p{margin:0}
h2{font-size:18px;margin:26px 0 6px}
p,li{max-width:65ch}
ul{padding-left:20px;margin:6px 0}
a{color:var(--chili)}
footer{color:var(--ink-soft);font-size:13px;border-top:1px solid var(--line);padding-block:16px 28px}
</style>
</head>

const order = ['en','ru','es','pt','de','fr','tr'];
function pick(){
  const h = location.hash.slice(1); if (L[h]) return h;
  for (const l of (navigator.languages || [navigator.language || 'en'])){ const c = String(l).slice(0,2).toLowerCase(); if (L[c]) return c; }
  return 'en';
}
function render(code){
  const t = L[code];
  document.documentElement.lang = code;
  document.title = t.app + ' · ' + t.title;
  document.getElementById('app').textContent = t.app;
  document.getElementById('kind').textContent = t.kind;
  document.getElementById('langs').innerHTML = order.map(c => `<button type="button" data-l="${c}" aria-pressed="${c === code}">${L[c].name}</button>`).join('');
  document.getElementById('doc').innerHTML = `<h1>${t.title}</h1><p class="date">${t.date}</p><div class="summary"><p>${t.summary}</p></div>` +
    t.s.map(([h, p]) => `<h2>${h}</h2><p>${p}</p>`).join('');
  document.getElementById('foot').textContent = '© 2026 Shawarmania · com.yusup02.shawarmania';
}
document.getElementById('langs').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; history.replaceState(null, '', '#' + b.dataset.l); render(b.dataset.l); });
addEventListener('hashchange', () => render(pick()));
render(pick());
