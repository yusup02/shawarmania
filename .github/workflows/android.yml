name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor
        run: npm ci

      - name: Copy the game into the Android project
        run: npx cap sync android

      - name: Restore the upload key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build APK and AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug bundleRelease

      - name: Check the Google Play signature
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          if keytool -printcert -jarfile "$AAB" 2>/dev/null | grep -q "SHA256:"; then
            FP=$(keytool -printcert -jarfile "$AAB" | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
            echo "::notice title=AAB signed::Ready for Google Play. Upload key SHA-256: $FP"
          else
            echo "::warning title=AAB not signed::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets, then run the build again. Google Play rejects unsigned bundles."
          fi

      - name: APK for your phone
        uses: actions/upload-artifact@v6
        with:
          name: shawarmania-apk-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB for Google Play
        uses: actions/upload-artifact@v6
        with:
          name: shawarmania-aab-${{ env.VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish the APK as a release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shawarmania.apk
          cp android/app/build/outputs/bundle/release/app-release.aab "shawarmania-$VERSION_NAME.aab"
          gh release create "v$VERSION_NAME" shawarmania.apk "shawarmania-$VERSION_NAME.aab" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Shawarmania $VERSION_NAME" \
            --notes "shawarmania.apk: install on your phone. shawarmania-$VERSION_NAME.aab: upload to Google Play Console." \
            --latest
